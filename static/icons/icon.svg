    <path d="M256,96 C246,96 238,110 238,136 L238,240 L132,300 L132,336 L238,300 L238,390 L206,416 L206,440 L256,428 L306,440 L306,416 L274,390 L274,300 L380,336 L380,300 L274,240 L274,136 C274,110 266,96 256,96 Z" fill="#ffffff" />
  </g>

  <!-- Sparkle Accent Top Right -->
  <path d="M380,100 L390,130 L420,140 L390,150 L380,180 L370,150 L340,140 L370,130 Z" fill="#fef08a" opacity="0.95" />
  <path d="M120,380 L126,400 L146,406 L126,412 L120,432 L114,412 L94,406 L114,400 Z" fill="#ffffff" opacity="0.75" />
